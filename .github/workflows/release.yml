name: Release

# 打 v* 标签触发。发布流程刻意和 CI 分开：CI 每次推送都跑、要快；
# 发布只在明确打标签时跑、要全。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 release、上传产物需要

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux 构建与发布
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Tauri 的系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: Swatinem/rust-cache@v2

      # 发版前再跑一遍测试。CI 已经跑过，但标签可能打在任意提交上，
      # 而"这个提交的测试是绿的"必须在产物发出去之前当场确认，
      # 不能依赖"记得那次 CI 是绿的"。
      - name: 测试
        run: cargo test --workspace --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Lokal ${{ github.ref_name }}
          releaseBody: |
            ## ⚠️ 学习项目，未经安全审计

            **不要把真实密码放进去。** 详见 README。

            ### 产物
            - `.deb` —— Debian / Ubuntu
            - `.AppImage` —— 通用 Linux

            ### 校验备份
            ```
            cargo run --release --example verify_backup -- <备份文件>
            ```
          # 草稿：产物传上来后由人过目再发布。
          # 发布是不可逆的对外动作，不该由一次 git push 直接完成。
          releaseDraft: true
          prerelease: false
          # `--locked` 是 cargo 的参数，不是 tauri build 的。必须放在 `--`
          # 之后透传给底层 runner，否则 tauri 会报 unexpected argument。
          args: -- --locked

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    # release 是 linux job 里的 tauri-action 创建的，APK 只能往已存在的
    # release 上传，所以必须等它。
    needs: linux
    # 没配签名密钥就跳过，而不是产出一个装不上的未签名包。
    # 未签名的 APK 会被 Android 直接拒绝安装——放进 release 里是个陷阱。
    # 配置方法见 README「发布 Android 版」。
    if: ${{ vars.ANDROID_SIGNING_CONFIGURED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 添加 Android 目标
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release

      - name: 还原签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # keystore 与口令都来自 Secrets，落地在 runner 的临时工作区，
          # 随 job 结束一起销毁。keystore.properties 在 .gitignore 里。
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 定位 NDK
        # 注意不能写成 `env: NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}`：
        # Actions 的 env 上下文只含 workflow 自己定义的变量，读不到 runner
        # 镜像预设的操作系统环境变量，结果是空串（实际踩过，报
        # "Android NDK invalid"）。在 shell 里用 $VAR 才读得到。
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          # 镜像换了变量名也不至于直接崩：退回到 SDK 目录下找最新的一个。
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          fi
          test -n "$NDK" && test -d "$NDK" || { echo "找不到 NDK"; exit 1; }
          echo "使用 NDK: $NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: 构建 APK
        run: |
          cargo install tauri-cli --version "^2.0" --locked
          cargo tauri android build --apk --target aarch64 -- --locked

      - name: 校验签名
        # 不能只看构建成功——必须确认产物真的被签了。
        # 未签名时 Gradle 输出的是 *-unsigned.apk，一样"构建成功"。
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -1)
          test -n "$APK" || { echo "找不到已签名的 APK（可能产出了 -unsigned）"; exit 1; }
          # 不写死 build-tools 版本：runner 镜像上的版本会变。
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "lokal-${GITHUB_REF_NAME}-arm64.apk"

      - name: 上传到 release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "lokal-${GITHUB_REF_NAME}-arm64.apk" --clobber
